<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f2">
  <title>Daymark — Todo list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f5f2;
      --white: #fff;
      --ink: #202923;
      --muted: #78827b;
      --line: #e5e9e4;
      --green: #315b45;
      --green-dark: #244635;
      --green-pale: #e8efe8;
      --coral: #d56d54;
      --shadow: 0 18px 50px rgb(37 52 42 / 7%);
      font-family: "DM Sans", "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#dce3dc 0.75px, transparent 0.75px);
      background-size: 18px 18px;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .app-shell {
      width: min(1080px, calc(100% - 48px));
      min-height: min(760px, calc(100vh - 64px));
      margin: 32px auto;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      overflow: hidden;
      background: var(--white);
      border: 1px solid rgb(32 41 35 / 5%);
      border-radius: 10px;
      box-shadow: var(--shadow);
      animation: arrive 550ms cubic-bezier(.2,.75,.25,1) both;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      padding: 34px 25px 26px;
      color: #f6f8f5;
      background: var(--green);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      color: var(--green-dark);
      background: #d8e5d8;
      border-radius: 8px;
    }

    .today-card {
      margin-top: 82px;
      padding-bottom: 25px;
      border-bottom: 1px solid rgb(255 255 255 / 17%);
    }

    .eyebrow {
      margin: 0;
      color: #bdd0c0;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .today-card h2 {
      margin: 9px 0 5px;
      font-family: Fraunces, Georgia, serif;
      font-size: 31px;
      font-weight: 500;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .today-date {
      margin: 0;
      color: #c8d7ca;
      font-size: 13px;
    }

    .nav-label {
      margin: 26px 0 10px;
      color: #bdd0c0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.1px;
      text-transform: uppercase;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 42px;
      padding: 0 11px;
      color: #f6f8f5;
      background: rgb(255 255 255 / 11%);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
    }

    .nav-item svg { color: #d7e5d8; }

    .nav-count {
      min-width: 24px;
      margin-left: auto;
      color: #d2dfd4;
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .sidebar-note {
      margin: auto 0 0;
      padding: 15px 0 0;
      color: #d3dfd5;
      font-family: Fraunces, Georgia, serif;
      font-size: 16px;
      line-height: 1.5;
    }

    .sidebar-note span {
      display: block;
      margin-top: 9px;
      color: #a9c0ad;
      font-family: "DM Sans", "Segoe UI", sans-serif;
      font-size: 11px;
      font-weight: 600;
    }

    .workspace {
      min-width: 0;
      padding: 48px 54px 32px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .section-label svg { color: var(--coral); }

    .save-state {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    .save-dot {
      width: 7px;
      height: 7px;
      background: #64a177;
      border-radius: 50%;
    }

    .save-state[data-error="true"] .save-dot { background: var(--coral); }

    h1 {
      margin: 20px 0 7px;
      font-family: Fraunces, Georgia, serif;
      font-size: 37px;
      font-weight: 500;
      line-height: 1.14;
      letter-spacing: 0;
    }

    .intro {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .add-form {
      display: flex;
      gap: 9px;
      margin-top: 30px;
    }

    .task-input {
      min-width: 0;
      height: 48px;
      flex: 1;
      padding: 0 15px;
      color: var(--ink);
      background: #fbfcfb;
      border: 1px solid #dfe5df;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .task-input::placeholder { color: #929b94; }
    .task-input:focus { border-color: #7c9c83; box-shadow: 0 0 0 3px rgb(91 133 99 / 12%); }

    .add-button {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      display: grid;
      place-items: center;
      color: white;
      background: var(--green);
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      transition: background 150ms ease, transform 150ms ease;
    }

    .add-button:hover { background: var(--green-dark); }
    .add-button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #edaa87; outline-offset: 3px; }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 31px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .filter-button, .clear-button {
      min-height: 30px;
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: color 150ms ease, background 150ms ease;
    }

    .filter-button:hover, .clear-button:hover { color: var(--ink); }
    .filter-button[aria-pressed="true"] { color: var(--green-dark); background: var(--green-pale); }
    .clear-button { padding-right: 0; color: #a06453; }
    .clear-button:disabled { color: #aab1ab; cursor: default; }

    .task-list {
      min-height: 235px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-row {
      min-height: 61px;
      display: flex;
      align-items: center;
      gap: 13px;
      border-bottom: 1px solid #edf0ed;
      animation: row-in 250ms ease both;
    }

    .check-label {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      position: relative;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .check-label input {
      position: absolute;
      width: 20px;
      height: 20px;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }

    .checkmark {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      color: transparent;
      border: 1.5px solid #cbd3cc;
      border-radius: 50%;
      transition: all 150ms ease;
    }

    .check-label input:focus-visible + .checkmark { outline: 3px solid #edaa87; outline-offset: 2px; }
    .check-label input:checked + .checkmark { color: white; background: #5e8a67; border-color: #5e8a67; }
    .task-text { min-width: 0; flex: 1; overflow-wrap: anywhere; font-size: 13px; line-height: 1.5; }
    .task-row.is-complete .task-text { color: #a2aaa3; text-decoration: line-through; text-decoration-color: #b4bdb5; }

    .delete-button {
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      display: grid;
      place-items: center;
      color: #9ca59e;
      background: transparent;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      opacity: 0;
      transition: color 150ms ease, background 150ms ease, opacity 150ms ease;
    }

    .task-row:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: #b7533d; background: #fbefec; }

    .empty-state {
      min-height: 235px;
      display: grid;
      align-content: center;
      justify-items: center;
      padding: 30px 15px;
      text-align: center;
      animation: row-in 300ms ease both;
    }

    .empty-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--green);
      background: var(--green-pale);
      border-radius: 50%;
    }

    .empty-state h2 {
      margin: 13px 0 5px;
      font-family: Fraunces, Georgia, serif;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .empty-state p { max-width: 250px; margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }

    .list-footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding-top: 14px;
      color: var(--muted);
      font-size: 11px;
    }

    .list-footer strong { color: #56635a; font-weight: 600; }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes row-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 760px) {
      .app-shell { width: min(620px, calc(100% - 28px)); min-height: calc(100vh - 28px); margin: 14px auto; grid-template-columns: 1fr; }
      .sidebar { min-height: 170px; padding: 22px 24px; }
      .today-card { margin-top: 24px; padding: 0; border: 0; }
      .today-card h2 { margin-top: 5px; font-size: 25px; }
      .today-date { font-size: 12px; }
      .sidebar .eyebrow, .nav-label, .nav-item, .sidebar-note { display: none; }
      .workspace { padding: 32px 28px 24px; }
      h1 { font-size: 32px; }
      .task-list, .empty-state { min-height: 205px; }
    }

    @media (max-width: 420px) {
      .workspace { padding: 27px 19px 21px; }
      .sidebar { padding-right: 19px; padding-left: 19px; }
      h1 { font-size: 29px; }
      .save-state { font-size: 10px; }
      .list-toolbar { align-items: flex-start; }
      .filters { gap: 0; }
      .filter-button { padding: 0 7px; }
      .clear-button { max-width: 92px; padding: 0; text-align: right; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Daymark overview">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 10.2 8.1 14 16 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span>daymark</span>
      </div>
      <section class="today-card" aria-labelledby="today-heading">
        <p class="eyebrow">A fresh start</p>
        <h2 id="today-heading">Today</h2>
        <p class="today-date" id="today-date"></p>
      </section>
      <p class="nav-label">Workspace</p>
      <div class="nav-item" aria-current="page">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M5 5.5h10M5 10h10M5 14.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="3" cy="5.5" r=".8" fill="currentColor"/><circle cx="3" cy="10" r=".8" fill="currentColor"/><circle cx="3" cy="14.5" r=".8" fill="currentColor"/></svg>
        <span>My tasks</span>
        <span class="nav-count" id="sidebar-count">0</span>
      </div>
      <p class="sidebar-note">“Great things are done by a series of small things brought together.”<span>— Vincent van Gogh</span></p>
    </aside>

    <main class="workspace">
      <div class="topline">
        <div class="section-label">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 5.5h11v10h-11zM7 3.5v4M13 3.5v4M4.5 8.5h11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Your personal space
        </div>
        <div class="save-state" id="save-state" role="status" aria-live="polite">
          <span class="save-dot" aria-hidden="true"></span><span id="save-label">Saved on this device</span>
        </div>
      </div>
      <h1>A little progress<br>adds up.</h1>
      <p class="intro">Make room for what matters today.</p>

      <form class="add-form" id="add-form">
        <input class="task-input" id="task-input" name="task" type="text" maxlength="200" placeholder="What needs doing?" aria-label="New task" autocomplete="off" required>
        <button class="add-button" type="submit" aria-label="Add task" title="Add task">
          <svg width="19" height="19" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </form>

      <div class="list-toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Done</button>
        </div>
        <button class="clear-button" id="clear-completed" type="button">Clear completed</button>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
      <footer class="list-footer">
        <span id="task-summary">No tasks yet</span>
        <strong id="progress-summary">A clear slate</strong>
      </footer>
    </main>
  </div>

  <script>
    (() => {
      const STORAGE_KEY = "daymark.todos.v1";
      const form = document.querySelector("#add-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const filterButtons = [...document.querySelectorAll("[data-filter]")];
      const clearButton = document.querySelector("#clear-completed");
      const summary = document.querySelector("#task-summary");
      const progress = document.querySelector("#progress-summary");
      const sidebarCount = document.querySelector("#sidebar-count");
      const saveState = document.querySelector("#save-state");
      const saveLabel = document.querySelector("#save-label");
      const todayDate = document.querySelector("#today-date");
      let activeFilter = "all";
      let tasks = loadTasks();

      todayDate.textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      }).format(new Date());

      function loadTasks() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
          return Array.isArray(saved)
            ? saved.filter((task) => task && typeof task.id === "string" && typeof task.text === "string" && typeof task.completed === "boolean")
            : [];
        } catch {
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
          saveState.dataset.error = "false";
          saveLabel.textContent = "Saved on this device";
        } catch {
          saveState.dataset.error = "true";
          saveLabel.textContent = "Could not save changes";
        }
      }

      function makeIcon(markup) {
        const wrapper = document.createElement("span");
        wrapper.innerHTML = markup;
        return wrapper.firstElementChild;
      }

      function render() {
        const visibleTasks = tasks.filter((task) => {
          if (activeFilter === "active") return !task.completed;
          if (activeFilter === "completed") return task.completed;
          return true;
        });
        const completedCount = tasks.filter((task) => task.completed).length;
        const remainingCount = tasks.length - completedCount;
        list.replaceChildren();

        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          const message = activeFilter === "completed" && tasks.length > 0
            ? ["Nothing completed yet", "Finished tasks will find a home here."]
            : activeFilter === "active" && tasks.length > 0
              ? ["All caught up", "Every task is done. Enjoy the breathing room."]
              : ["A clear slate", "Add your first task above and make today yours."];
          empty.innerHTML = '<span class="empty-icon" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 20 20" fill="none"><path d="M4 10.2 8.1 14 16 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
          const heading = document.createElement("h2");
          heading.textContent = message[0];
          const description = document.createElement("p");
          description.textContent = message[1];
          empty.append(heading, description);
          list.append(empty);
        } else {
          for (const task of visibleTasks) {
            const row = document.createElement("li");
            row.className = `task-row${task.completed ? " is-complete" : ""}`;

            const label = document.createElement("label");
            label.className = "check-label";
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;
            checkbox.setAttribute("aria-label", `${task.completed ? "Mark incomplete" : "Complete"}: ${task.text}`);
            checkbox.addEventListener("change", () => {
              task.completed = checkbox.checked;
              saveTasks();
              render();
            });
            const checkmark = document.createElement("span");
            checkmark.className = "checkmark";
            checkmark.setAttribute("aria-hidden", "true");
            checkmark.append(makeIcon('<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="m2 6.3 2.5 2.4L10 3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
            label.append(checkbox, checkmark);

            const text = document.createElement("span");
            text.className = "task-text";
            text.textContent = task.text;

            const remove = document.createElement("button");
            remove.className = "delete-button";
            remove.type = "button";
            remove.setAttribute("aria-label", `Delete ${task.text}`);
            remove.title = "Delete task";
            remove.append(makeIcon('<svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.5 6h11M8 6V4.5h4V6m2.5 0-.6 9h-7.8l-.6-9m3 3v3.5m3-3v3.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'));
            remove.addEventListener("click", () => {
              tasks = tasks.filter((item) => item.id !== task.id);
              saveTasks();
              render();
            });

            row.append(label, text, remove);
            list.append(row);
          }
        }

        summary.textContent = tasks.length === 0
          ? "No tasks yet"
          : `${remainingCount} task${remainingCount === 1 ? "" : "s"} left`;
        progress.textContent = tasks.length === 0
          ? "A clear slate"
          : `${completedCount} of ${tasks.length} done`;
        sidebarCount.textContent = String(remainingCount);
        clearButton.disabled = completedCount === 0;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        tasks.unshift({ id: crypto.randomUUID(), text, completed: false });
        activeFilter = "all";
        filterButtons.forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.filter === activeFilter)));
        saveTasks();
        render();
        input.value = "";
        input.focus();
      });

      filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeFilter = button.dataset.filter;
          filterButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        render();
      });

      render();
    })();
  </script>
</body>
</html>
